<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog preview card refactored with Tailwind CSS utility classes.">
  <title>Frontend Mentor | Blog Preview Card</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-[#f4d04e] font-sans text-[#111111]">
  <main class="grid min-h-screen place-items-center px-6 py-10">
    <article
      class="w-full max-w-[384px] rounded-[20px] border border-black bg-white p-6 shadow-[8px_8px_0_#000] transition-shadow duration-200 hover:shadow-[12px_12px_0_#000]">
      <img class="h-[200px] w-full rounded-[10px] object-cover" src="./assets/images/illustration-article.svg"
        alt="Abstract yellow and black article illustration">

      <div class="mt-6">
        <p class="inline-block rounded bg-[#f4d04e] px-3 py-1 text-sm font-extrabold">
          Learning
        </p>

        <p class="mt-3 text-sm font-medium">
          Published 21 Dec 2023
        </p>

        <h1 class="mt-4">
          <a class="text-xl font-extrabold leading-8 tracking-tight transition-colors hover:text-[#f4d04e] focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-4 sm:text-2xl"
            href="#">
            HTML &amp; CSS foundations
          </a>
        </h1>

        <p class="mt-3 text-sm leading-6 text-slate-500 sm:text-base">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>

      <footer class="mt-6 flex items-center gap-3">
        <img class="h-8 w-8 rounded-full" src="./assets/images/image-avatar.webp" alt="Portrait of Greg Hooper">
        <p class="text-sm font-extrabold">Greg Hooper</p>
      </footer>
    </article>
  </main>
</body>

</html>
