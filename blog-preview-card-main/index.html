<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog Preview Card</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-yellow-300 text-slate-950">
  <main class="grid min-h-screen place-items-center p-6">
    <article class="w-full max-w-sm rounded-2xl border border-black bg-white p-6 shadow-[8px_8px_0_#000]">
      <img class="w-full rounded-xl" src="./assets/images/illustration-article.svg"
        alt="Abstract yellow and black article illustration">

      <div class="mt-6">
        <p class="inline-block rounded bg-yellow-300 px-3 py-1 font-bold">
          Learning
        </p>

        <p class="mt-3 text-sm">Published 21 Dec 2023</p>

        <h1 class="mt-4 text-2xl font-bold">
          HTML &amp; CSS foundations
        </h1>

        <p class="mt-4 text-slate-500">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>

      <footer class="mt-6 flex items-center gap-3">
        <img class="h-8 w-8 rounded-full" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
        <p class="font-bold">Greg Hooper</p>
      </footer>
    </article>
  </main>
</body>

</html>
