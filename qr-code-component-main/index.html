<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive QR code component refactored with Tailwind CSS.">
  <title>Frontend Mentor | QR Code Component</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-[#d5e1ef] font-sans text-slate-900">
  <main class="grid min-h-screen place-items-center px-4 py-8 sm:px-6 md:px-8">
    <section class="w-full max-w-[280px] sm:max-w-[320px] md:max-w-[360px]" aria-label="QR code card">
      <article class="rounded-[20px] bg-white p-3 text-center shadow-lg sm:p-4 md:p-5"> <img
          class="aspect-square w-full rounded-[10px] object-cover" src="./images/image-qr-code.png"
          alt="QR code linking to Frontend Mentor">
        <div class="px-2 pb-4 pt-5 sm:px-3 sm:pb-5 sm:pt-6">
          <h1 class="text-lg font-bold leading-6 tracking-tight text-slate-900 sm:text-xl md:text-[22px] md:leading-7">
            Improve your front-end skills by building projects </h1>
          <p class="mt-4 text-sm leading-5 text-slate-500 sm:text-[15px] md:leading-6"> Scan the QR code to visit
            Frontend Mentor and take your coding skills to the next level. </p>
        </div>
      </article>
    </section>
  </main>
</body>

</html>
