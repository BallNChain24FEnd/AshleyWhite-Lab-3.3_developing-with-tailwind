<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | QR Code Component</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-slate-200 text-slate-900">
  <main class="grid min-h-screen place-items-center p-6">
    <section class="w-full max-w-xs">
      <article class="rounded-3xl bg-white p-4 text-center shadow-lg">
        <img class="w-full rounded-2xl" src="./images/image-qr-code.png" alt="QR code linking to Frontend Mentor">

        <div class="px-3 py-6">
          <h1 class="text-xl font-bold leading-tight">
            Improve your front-end skills by building projects
          </h1>

          <p class="mt-4 text-sm leading-6 text-slate-500">
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level.
          </p>
        </div>
      </article>
    </section>
  </main>
</body>

</html>
